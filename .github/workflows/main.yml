name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip
      run: unzip Zen0Ware.zip
    - name: Install NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV
        echo "NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV
    - name: Build
      run: |
        cd Astra
        cat build.sh
        export PATH=$ANDROID_NDK_HOME:$PATH
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: zen0ware-so
        path: Astra/libs/arm64-v8a/libmain.so
